[project]
name = "gpucc"
version = "0.1.0"
description = "SetWhichGPU – Windows 11 tray app with hotkey overlay for GPU monitoring and per-app GPU preferences"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
# Distribution is planned via installers/winget, not PyPI – keeps accidental uploads impossible.
classifiers = [
    "Private :: Do Not Upload",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.13",
    "Environment :: Win32 (MS Windows)",
]
dependencies = [
    "PySide6-Essentials>=6.9",
    "nvidia-ml-py>=12.0",
]
keywords = ["gpu", "graphics card", "multi-gpu", "windows 11", "gpu preference", "nvidia", "intel arc", "amd"]

[project.urls]
Homepage = "https://mastertoken.github.io/SetWhichGPU/"
Repository = "https://github.com/Mastertoken/SetWhichGPU"
Issues = "https://github.com/Mastertoken/SetWhichGPU/issues"
Changelog = "https://github.com/Mastertoken/SetWhichGPU/blob/main/CHANGELOG.md"

[project.scripts]
gpucc = "gpucc.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpucc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
qt_api = "pyside6"
addopts = "-ra --strict-markers -m 'not windows and not hardware'"
markers = [
    "windows: real (read-only) Win32 API calls",
    "hardware: requires real GPUs and GPUCC_HW_TESTS=1",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["tools/spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "PL"]
# PLR09xx: complexity limits too strict for UI builders / ctypes wrappers.
ignore = [
    "PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "RUF012",
    "RUF001", "RUF002", "RUF003",  # German UI text uses en dashes etc. on purpose
    "PLC0415",  # lazy imports keep vendor/Qt libraries out of startup paths and tests
    "ANN401",  # ctypes COM vtable calls are inherently Any-typed
]

[tool.ruff.lint.per-file-ignores]
"src/gpucc/i18n/de.py" = ["E501"]  # translation catalog: one entry per line reads best
"tests/**" = ["ANN", "PLR"]
"tools/**" = ["ANN", "PLR", "T20"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pynvml"]
ignore_missing_imports = true
